

<section class="products">
    <div class="products-content">
        <div class="suggestions">
            <p id="Featured" class="sug active" >Featured</p>
            <p id="Popular" class="sug">Popular</p>
            <p id="New-added" class="sug">New added</p>
        </div>
        <div class="group">
            <div class="item" *ngFor="let item of productListbyid">
                <div class="img-container">
                    <div class="date">New</div>
                    <img [src]="item.productImageUrl" alt="">
                    <div class="icons">
                    <a href="../display/img.html" class="veiw" data-text="show"><i class='bx bx-show'></i></a>
                    <a class="favorite" data-text="add to fevorit"><i class='bx bx-heart'></i></a>
                    </div>
                </div>
                <p>{{item.categoryName}}</p>
                <h2>{{item.productName}}</h2>
                <div class="star-price-cart-container">
                <div class="stars-price">
                <div class="stars">
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                    <i class='bx bxs-star'></i>
                </div>
                <p class="price"><span class="number" style="padding-right: 5px;">${{item.productPrice}}</span> <span class="delete">$245.8</span></p>
            </div>
            <div class="cart" data-text="add to cart">
                <i class='bx bx-shopping-bag'></i>
            </div>
            </div>
            </div>
        </div>
    </div>
  </section>
